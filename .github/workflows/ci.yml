name: Code Migration AI CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint, Security & Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: codemigration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "true"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run MyPy Static Typing
        working-directory: backend
        run: |
          mypy app/ --ignore-missing-imports --explicit-package-bases

      - name: Run Bandit Security Analysis
        run: |
          bandit -c backend/pyproject.toml -r backend/app/ -x "*/tests/*"

      - name: Run Pytest Unit & Integration Tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-chars-minimum-length-for-ci
          POSTGRES_ASYNC_URI: ${{ secrets.POSTGRES_ASYNC_URI || 'postgresql+asyncpg://test_user:test_password@localhost:5432/codemigration_test' }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          NEO4J_URI: ${{ secrets.NEO4J_URI || 'bolt://localhost:7687' }}
          NEO4J_USER: ${{ secrets.NEO4J_USER || 'neo4j' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'testpassword123' }}
          QDRANT_HOST: ${{ secrets.QDRANT_HOST || 'localhost' }}
          QDRANT_PORT: ${{ secrets.QDRANT_PORT || '6333' }}
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            tests/

      - name: Upload Backend Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: |
          npx vitest run tests/

      - name: Build Frontend Bundle
        working-directory: frontend
        run: |
          npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  e2e:
    name: Multi-Tenant E2E Test Suite Pipeline
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: codemigration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "true"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx uvicorn websockets pyjwt redis python-dotenv langsmith

      - name: Start Backend Server
        working-directory: backend
        env:
          ENVIRONMENT: test
          DEBUG: "true"
          SECRET_KEY: test-secret-key-32-chars-minimum-length-for-ci
          POSTGRES_ASYNC_URI: ${{ secrets.POSTGRES_ASYNC_URI || 'postgresql+asyncpg://test_user:test_password@localhost:5432/codemigration_test' }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          NEO4J_URI: ${{ secrets.NEO4J_URI || 'bolt://localhost:7687' }}
          NEO4J_USER: ${{ secrets.NEO4J_USER || 'neo4j' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'testpassword123' }}
          QDRANT_HOST: ${{ secrets.QDRANT_HOST || 'localhost' }}
          QDRANT_PORT: ${{ secrets.QDRANT_PORT || '6333' }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT || 'codemigration-ai' }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend_ci.log 2>&1 &
          echo "Waiting for Backend Server to become healthy on http://localhost:8000/health..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "status"; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done

      - name: Execute Multi-Tenant E2E Pipeline
        env:
          POSTGRES_ASYNC_URI: ${{ secrets.POSTGRES_ASYNC_URI || 'postgresql+asyncpg://test_user:test_password@localhost:5432/codemigration_test' }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT || 'codemigration-ai' }}
        run: |
          python e2e_test_pipeline.py --base-url http://localhost:8000

      - name: Upload Backend Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: backend/backend_ci.log
          if-no-files-found: ignore

  docker-validation:
    name: Docker Compose & Images Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build -t codemigration-backend:latest backend/

      - name: Build Frontend Docker Image
        run: |
          docker build -t codemigration-frontend:latest frontend/