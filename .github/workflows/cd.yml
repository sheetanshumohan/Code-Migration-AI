name: Code Migration AI CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  validate:
    name: Mandatory Production Validation
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: codemigration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "true"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Backend validation
      # -------------------------

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Run Backend Ruff Linter
        run: |
          ruff check backend/

      - name: Run Backend MyPy Type Checker
        working-directory: backend
        run: |
          mypy app/ --ignore-missing-imports --explicit-package-bases

      - name: Run Backend Bandit Security Audit
        run: |
          bandit -c backend/pyproject.toml -r backend/app/ -x "*/tests/*"

      - name: Run Backend Unit & Integration Tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-chars-minimum-length-for-ci
          POSTGRES_ASYNC_URI: ${{ secrets.POSTGRES_ASYNC_URI || 'postgresql+asyncpg://test_user:test_password@localhost:5432/codemigration_test' }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          REDIS_SSL: "false"
          NEO4J_URI: ${{ secrets.NEO4J_URI || 'bolt://localhost:7687' }}
          NEO4J_USER: ${{ secrets.NEO4J_USER || 'neo4j' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'testpassword123' }}
          QDRANT_HOST: ${{ secrets.QDRANT_HOST || 'localhost' }}
          QDRANT_PORT: ${{ secrets.QDRANT_PORT || '6333' }}
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            tests/

      - name: Start Backend Server for E2E Gate
        working-directory: backend
        env:
          ENVIRONMENT: test
          DEBUG: "true"
          SECRET_KEY: test-secret-key-32-chars-minimum-length-for-ci
          POSTGRES_ASYNC_URI: ${{ secrets.POSTGRES_ASYNC_URI || 'postgresql+asyncpg://test_user:test_password@localhost:5432/codemigration_test' }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          REDIS_SSL: "false"
          NEO4J_URI: ${{ secrets.NEO4J_URI || 'bolt://localhost:7687' }}
          NEO4J_USER: ${{ secrets.NEO4J_USER || 'neo4j' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'testpassword123' }}
          QDRANT_HOST: ${{ secrets.QDRANT_HOST || 'localhost' }}
          QDRANT_PORT: ${{ secrets.QDRANT_PORT || '6333' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT || 'codemigration-ai' }}
        run: |
          echo "Running Alembic migrations..."
          alembic upgrade head
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend_cd.log 2>&1 &
          echo "Waiting for Backend Server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "status"; then
              echo "Backend is ready!"
              break
            fi
            sleep 2
          done

      - name: Run Multi-Tenant E2E Test Suite
        env:
          SECRET_KEY: test-secret-key-32-chars-minimum-length-for-ci
          POSTGRES_ASYNC_URI: ${{ secrets.POSTGRES_ASYNC_URI || 'postgresql+asyncpg://test_user:test_password@localhost:5432/codemigration_test' }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          REDIS_SSL: "false"
        run: |
          python e2e_test_pipeline.py --base-url http://localhost:8000

      # -------------------------
      # Frontend validation
      # -------------------------

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: |
          npm run test

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm run build

  deploy-backend:
    name: Deploy Backend to Render
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --show-error \
            --silent \
            --request POST \
            --get \
            --data-urlencode "ref=${DEPLOY_COMMIT_SHA}" \
            "${RENDER_DEPLOY_HOOK_URL}"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Install Vercel CLI
        run: |
          npm install --global vercel@latest

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          export PATH="$PWD/frontend/node_modules/.bin:$PATH"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"