[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codemigration-ai"
version = "1.0.0"
description = "Enterprise Agentic Code Modernization, Migration & Refactoring Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # function call in default argument (FastAPI Depends)
    "B904",  # within an except clause, raise exceptions with raise ... from err
    "E501",  # line length handled by formatter
    "E731",  # do not assign a lambda expression
    "E402",  # module level import not at top of file
    "E701",  # multiple statements on one line
    "B007",  # loop control variable not used
    "B005",  # using strip with multi-char
    "C901",  # mccabe complexity
    "W291",  # trailing whitespace in multi-line prompt templates
    "W293",  # blank line contains whitespace in multi-line strings
    "W292",  # no newline at end of file
    "E741",  # ambiguous variable name
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
pythonpath = ["."]
testpaths = [
    "tests",
]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = [
    "misc",
    "assignment",
    "arg-type",
    "call-arg",
    "truthy-function",
    "override",
    "call-overload",
    "attr-defined",
]

